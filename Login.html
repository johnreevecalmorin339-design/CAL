<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechStore Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0f172a;
        }

        .login-box {
            width: 350px;
            padding: 40px;
            background: #1e293b;
            border-radius: 15px;
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.3);
        }

        .login-box h1 {
            text-align: center;
            color: #bd04bd;
            margin-bottom: 10px;
        }

        .login-box p {
            text-align: center;
            color: #cbd5e1;
            margin-bottom: 30px;
        }

        .input-box {
            margin-bottom: 20px;
        }

        .input-box label {
            color: white;
            display: block;
            margin-bottom: 8px;
        }

        .input-box input {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 5px;
            outline: none;
            background: #334155;
            color: white;
        }

        .input-box input:focus {
            border: 2px solid #38bdf8;
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 5px;
            background: #f83838;
            color: #0f172a;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-btn:hover {
            background: #0e53e9;
        }

        .register {
            text-align: center;
            margin-top: 20px;
            color: #5276a1;
        }


    </style>
</head>

<body>

    <div class="login-box">

        <h1>Tech Store</h1>
        <p>Login account</p>

        <form action="homepage.html">

            <div class="input-box">
                <label>Username</label>
                <input type="text" placeholder="Enter username" required>
            </div>

            <div class="input-box">
                <label>Password</label>
                <input type="password" placeholder="Enter password" required>
            </div>

            <button type="submit" class="login-btn">
                Login
            </button>
            
</body>
</html>
